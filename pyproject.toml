[project]
name = "EmotioNN"
version = "0.1.1"
description = "Attention-based neural netword that recognizes emotion in texts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3.3",
    "pytorch-ignite>=0.5.3",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "tokenizers>=0.22.1",
    "torch>=2.9.1",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
]
